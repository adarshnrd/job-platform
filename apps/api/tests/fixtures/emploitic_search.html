fondateur et contribuerez aux premiers projets ainsi qu’à la mise en place de nos méthodes de développement.</p><p>Cette annonce s’inscrit dans une démarche de présélection. La prise de poste sera organisée après la confirmation des premiers projets clients et la mise en place des conditions d’embauche en Algérie. Le calendrier et les conditions du recrutement seront précisés avec les candidats retenus.</p><p><strong>Vos missions</strong></p><ul><li><p>Analyser les besoins et proposer des solutions adaptées, en privilégiant les possibilités du standard Odoo.</p></li><li><p>Estimer les charges de développement et signaler les risques.</p></li><li><p>Développer, adapter et maintenir des modules Odoo.</p></li><li><p>Réaliser des connecteurs et des intégrations avec des applications tierces.</p></li><li><p>Diagnostiquer et corriger les anomalies sur des développements existants.</p></li><li><p>Participer aux reprises de données et, selon les projets, aux migrations.</p></li><li><p>Préparer les tests, documenter les développements et accompagner les mises en production.</p></li><li><p>Échanger avec les interlocuteurs techniques et fonctionnels des intégrateurs clients.</p></li><li><p>Contribuer à des pratiques fiables : Git, revues de code, tests, sécurité et documentation.</p></li></ul><p><strong>Le profil recherché</strong></p><p>Vous disposez idéalement de 3 à 5 ans d’expérience en développement, avec une pratique solide d’Odoo et des réalisations déployées en production.</p><p>Vous pouvez expliquer précisément votre contribution à ces projets, les difficultés rencontrées et les solutions apportées.</p><p>Vous maîtrisez :</p><ul><li><p>Python, le framework et l’ORM Odoo.</p></li><li><p>Les modules personnalisés, les modèles de données et les droits d’accès.</p></li><li><p>PostgreSQL, Git, XML et QWeb.</p></li><li><p>Les échanges avec des API et l’intégration d’outils tiers.</p></li><li><p>Le diagnostic d’anomalies, les tests et la maintenance de code.</p></li></ul><p>Vous connaissez les principaux processus métier liés aux ventes, aux achats et aux stocks. Vous savez distinguer le paramétrage d’un développement spécifique et proposer une solution proportionnée au besoin.</p><p>Vous travaillez avec autonomie, communiquez sur votre avancement et alertez lorsque des difficultés affectent les délais ou la qualité.</p><p>Une bonne maîtrise professionnelle du français, à l’écrit comme à l’oral, est nécessaire. Vous êtes à l’aise avec la documentation technique en anglais.</p><p>Une formation en informatique de niveau Bac +3 à Bac +5 est appréciée. Une expérience professionnelle équivalente sera également considérée.</p><p><strong>Des compétences supplémentaires appréciées</strong></p><p>Migrations Odoo, JavaScript/OWL, Odoo.sh, Linux, Docker, intégration continue, contributions OCA ou expérience chez un intégrateur.</p><p><strong>Perspectives d’évolution</strong></p><p>À mesure que l’activité se développera, vous pourrez progressivement prendre davantage de responsabilités techniques, accompagner d’autres développeurs et participer aux évaluations techniques lors des recrutements.</p><p>Une expérience préalable de management n’est pas exigée. Cette évolution dépendra de vos compétences démontrées, de vos aspirations et des besoins de l’équipe.</p><p><strong>Conditions du poste</strong></p><ul><li><p>Poste salarié à temps plein.</p></li><li><p>Rémunération fixe mensuelle à convenir selon le profil et les responsabilités.</p></li><li><p>Organisation du travail précisée avant l’embauche.</p></li><li><p>Date de prise de poste définie après confirmation des premiers projets.</p></li></ul><p><strong>Pour candidater</strong></p><p>Joignez votre CV et une courte présentation de deux projets Odoo : contexte, versions utilisées, modules concernés, contribution personnelle et difficultés résolues.</p><p>Précisez vos prétentions salariales mensuelles nettes en DZD, hors primes, ainsi que votre délai de disponibilité.</p><p>Vous pouvez partager des réalisations publiques ou un dépôt de code, en respectant la confidentialité de vos clients et employeurs.</p><p>La sélection comprendra un échange avec le fondateur, une discussion sur vos réalisations et une courte évaluation technique.</p>", "location": [{"id": "c1dfd96eea8cc2b62785275bca38ac261256e278", "arn": "arn:local:listy:::node/9b2b03a9efc40ddec8fc19ea3f3b9ed2d6828acf/c1dfd96eea8cc2b62785275bca38ac261256e278", "label": "Alger, Algérie", "lang": "fr", "metadata": {"ISO3166-2": "DZ-16", "admin_level": "4", "legacyId": "6", "name:ar": "الجزائر", "name:en": "Algiers", "name:fr": "Alger", "parentId": "da4b9237bacccdf19c0760cab7aec4a8359010b0", "ref": "16"}}], "contractType": [{"id": "09d66f6e5482d9b0ba91815c350fd9af3770819b", "arn": "arn:local:listy:::node/4636d41802e8b07d10e46be37205de9c694e1bde/09d66f6e5482d9b0ba91815c350fd9af3770819b", "label": "CDI", "lang": "fr", "metadata": {"legacyId": "260", "legacyState": "published"}}], "workMode": "onsite", "jobLevel": [{"id": "81110df80ca4086e306c4c52ab485a35cf761acc", "arn": "arn:local:listy:::node/6c44c30c53c6d9d16082e5a3e5211fd697a688f5/81110df80ca4086e306c4c52ab485a35cf761acc", "label": "Confirmé / Expérimenté", "lang": "fr", "metadata": {"legacyId": "322", "legacyState": "published", "legacyValue": "4"}}, {"id": "601ca99d55f00a2e8e736676b606a4d31d374fdd", "arn": "arn:local:listy:::node/6c44c30c53c6d9d16082e5a3e5211fd697a688f5/601ca99d55f00a2e8e736676b606a4d31d374fdd", "label": "Responsable d'Équipe", "lang": "fr", "metadata": {"legacyId": "112", "legacyState": "published", "legacyValue": "5"}}], "educationLevel": [{"id": "a2e33d344f272e100d4a8efeabc7ae8a60a8ba7a", "arn": "arn:local:listy:::node/ecb45cfdebd48df6e48393e6e560712a24c85daa/a2e33d344f272e100d4a8efeabc7ae8a60a8ba7a", "label": "Licence (LMD), Bac + 3", "lang": "fr", "metadata": {"legacyId": "119", "legacyState": "published", "legacyValue": "7"}}, {"id": "775bc5c30e27f0e562115d136e7f7edbd3cead89", "arn": "arn:local:listy:::node/ecb45cfdebd48df6e48393e
