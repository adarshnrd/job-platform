ork design, risk appetite and tolerance setting, risk and control self-assessments, key risk indicators and risk reporting&lt;br /&gt;• Develop risk registers, heat maps, risk appetite statements, policies, procedures and governance structures tailored to client needs. &lt;br /&gt;• Manage engagement scope, timelines, budgets, deliverables and quality, escalating issues to the Director as needed.&lt;br /&gt;• Act as a primary day-to-day client contact, building strong working relationships with risk, audit and operational stakeholders.&lt;br /&gt;• Present findings, recommendations and deliverables clearly to management and, where appropriate, board and committee audiences.&lt;br /&gt;•Lead, coach and review the work of consultants and analysts, providing direction, feedback and on-the-job development.&lt;br /&gt;• Manage resourcing and workload allocation across concurrent engagements&lt;br /&gt;• Support proposal development, scoping and pricing for risk management opportunities.&lt;br /&gt;• Identify follow-on and cross-service opportunities within existing accounts.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Skills  : &lt;/strong&gt;-&lt;/p&gt;&lt;p&gt;• Strong risk-management technical skills across ERM, operational and emerging risk.&lt;br /&gt;• Project and engagement management, including scope, budget and quality control.&lt;br /&gt;• Client relationship management and clear written and verbal communication.&lt;br /&gt;• Team leadership and coaching skills.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Tools Experience : -&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;• GRC and risk management platforms (e.g. ServiceNow GRC, RSA Archer or equivalent).&lt;br /&gt;• Reporting and BI tools (e.g. Power BI, Tableau) and advanced Excel for risk analytics and dashboards.&lt;br /&gt;• Risk register, heat-map and KRI/KPI tooling.&lt;br /&gt;• Microsoft 365 or equivalent productivity and collaboration suites.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style='padding: 10px 0px;border: 1px solid transparent;'&gt;&lt;div style='font-size:14px;word-wrap: break-word;'&gt;&lt;H2 style='font-size: 1em; margin: 0px'&gt;&lt;b&gt;Qualifications:&lt;/b&gt;&lt;/H2&gt;&#13;&lt;/div&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Minimum Work Experience &amp; Education&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;• Minimum 7 years of relevant risk-management experience, including experience in a consulting or advisory environment.&lt;br /&gt;• Minimum 2 years managing engagement and teams end to end.&lt;br /&gt;• Demonstrated experience designing or implementing ERM frameworks, risk appetite and control assessments.&lt;br /&gt;• Experience supporting national / sector-wide cyber risk and maturity programmes — such as the National Cybersecurity Index Program — including cyber risk scoring, maturity assessment and KRI/KPI design, is strongly preferred.&lt;br /&gt;• Bachelor’s degree in Computer Science, Information Technology, Cybersecurity, or a related field.&lt;br /&gt;• Master’s degree preferred.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;","title":"Manager - Cyber Consulting Services (CPX)","datePosted":"2026-10-15","@context":"http://schema.org","occupationalCategory":"Information Technology Operations","directApply":false}</script>
