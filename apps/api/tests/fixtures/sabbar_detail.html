ny activities, including company events, demos, and cross-team collaborations.\u003c/li>\u003c/ul>\u003ch3>Qualifications and Requirements\u003c/h3>\u003cul>\u003cli>Final-year student or recent graduate (within the last 12 months) in Computer Science, Software Engineering, or a related discipline.\u003c/li>\u003cli>Practical experience using agentic coding tools, such as Claude Code, as a fundamental part of the workflow, demonstrating discernment in trusting and scrutinizing their output.\u003c/li>\u003cli>Working proficiency in at least one programming language, such as Java, C++, or Python.\u003c/li>\u003cli>A solid understanding of core software development fundamentals, including version control, testing, and debugging.\u003c/li>\u003cli>Evidence of personal projects outside of academic coursework, such as side projects, hackathon entries, open-source contributions, or prior internships.\u003c/li>\u003cli>Demonstrated problem-solving ability, with the capacity to articulate the breakdown and resolution of complex problems.\u003c/li>\u003cli>Clear written communication skills, capable of explaining technical work and design decisions effectively.\u003c/li>\u003cli>Independence in work, coupled with the judgment to seek assistance when needed rather than remaining stuck.\u003c/li>\u003c/ul>\u003ch3>Application Process\u003c/h3>\u003cp>We encourage qualified candidates to apply for this internship opportunity at Lean Technologies.\u003c/p>","datePosted":"2026-10-14","validThrough":"2026-11-12T00:00:00+03:00","employmentType":"PART_TIME","identifier":{"@type":"PropertyValue","name":"Lean Technologies","value":"9efa8804-be0f-4109-b7aa-8e7789c0d8d6"},"hiringOrganization":{"@type":"Organization","name":"Lean Technologies","description":"Lean Technologies is the leading payments, data, and verification infrastructure powering the MENA economy. We combine Open Finance and Open Banking into a single platform, giving banks, fintechs, and enterprises across the UAE and Saudi Arabia everything they need to move money, verify customers and access financial data. We are licensed and regulated in both markets, operating under the Saudi Central Bank (SAMA), the Central Bank of the UAE (CBUAE), and the Abu Dhabi Global Market (ADGM).","url":"https://sabbar.com/en/jobs/companies/lean-technologies"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"SA","addressLocality":"Riyadh"}},"directApply":false}</script>
